# gitleaks is optional: `brew install gitleaks` enables the secrets step below.
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,mjs,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,mjs,jsx,ts,tsx}"
      run: node scripts/quality/lint-staged.mjs {staged_files}
    - name: typecheck
      run: node scripts/quality/scope.mjs typecheck --staged
    - name: secrets
      run: command -v gitleaks >/dev/null && gitleaks protect --staged --redact || echo "gitleaks not installed, skipping (brew install gitleaks)"

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    check:
      run: node scripts/quality/pre-push.mjs
